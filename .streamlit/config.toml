[theme]
base = "dark"
primaryColor = "#FF6A2B"
backgroundColor = "#0B1020"
secondaryBackgroundColor = "#151B30"
textColor = "#E8ECF4"
font = "sans serif"

[server]
headless = true
enableXsrfProtection = true

[client]
# "viewer" hides the developer toolbar (Fork, GitHub, Deploy) for everyone, including the app owner
toolbarMode = "viewer"

[browser]
gatherUsageStats = false
